<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histogram Kesehatan</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #10b981; /* Warna hijau khas kesehatan */
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }

        input, button, select {
            padding: 10px 14px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input, select {
            background: #1e293b;
            color: white;
        }

        input:focus, select:focus {
            border-color: #10b981;
        }

        button {
            background: #10b981;
            color: #0f172a;
            cursor: pointer;
            font-weight: bold;
            border: none;
            align-self: flex-end;
            height: 40px;
        }

        button:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .signal {
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-top: 25px;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .buy-style {
            background: #15803d;
            color: #f0fdf4;
            box-shadow: 0 0 15px rgba(21, 128, 61, 0.4);
        }

        .sell-style {
            background: #b91c1c;
            color: #fef2f2;
            box-shadow: 0 0 15px rgba(185, 28, 28, 0.4);
        }

        .wait-style {
            background: #475569;
            color: #f8fafc;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .info-box {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #334155;
        }

        .info-box h3 {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-box p {
            font-size: 24px;
            font-weight: bold;
            color: #f1f5f9;
        }

        .chart-container {
            position: relative;
            margin-top: 20px;
            height: 350px;
            width: 100%;
        }

        canvas {
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100% !important;
            height: 100% !important;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #10b981;
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HISTOGRAM KESEHATAN</h1>

    <div class="card">
        <div class="controls">
            <!-- Parameter disamarkan agar terlihat seperti analisis medis -->
            <div class="control-group">
                <label for="lookback">Siklus Deteksi</label>
                <input type="number" id="lookback" value="14" min="1">
            </div>

            <div class="control-group">
                <label for="smooth">Penghalus Frekuensi</label>
                <input type="number" id="smooth" value="3" min="1">
            </div>

            <div class="control-group">
                <label for="highLevel">Batas Atas Detak</label>
                <input type="number" id="highLevel" value="85" min="1" max="100">
            </div>

            <div class="control-group">
                <label for="lowLevel">Batas Bawah Detak</label>
                <input type="number" id="lowLevel" value="15" min="1" max="100">
            </div>

            <div class="control-group">
                <label for="interval">Periode Analisis</label>
                <select id="interval">
                    <option value="1h">H1 (1 Jam)</option>
                    <option value="4h">H4 (4 Jam)</option>
                    <option value="1d">D1 (1 Hari)</option>
                </select>
            </div>

            <button onclick="loadData()">REFRESH DATA</button>
        </div>

        <div id="loading" class="loading">
            Menghubungkan ke pusat server kesehatan...
        </div>

        <!-- Wadah Chart Harga (GU Close + EMA) -->
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>

        <!-- Wadah Chart Histogram -->
        <div class="chart-container">
            <canvas id="histChart"></canvas>
        </div>

        <div id="signalBox" class="signal wait-style">
            N
        </div>

        <div class="info">
            <div class="info-box">
                <h3>Nilai Detak (GU)</h3>
                <p id="priceText">0.00000</p>
            </div>

            <div class="info-box">
                <h3>Detak Indeks</h3>
                <p id="histValue">0.00</p>
            </div>

            <div class="info-box">
                <h3>Kondisi Indeks</h3>
                <p id="signalText" style="color: #94a3b8;">N</p>
            </div>

            <div class="info-box">
                <h3>Status Tren (EMA)</h3>
                <p id="trendText" style="color: #94a3b8;">N</p>
            </div>
        </div>
    </div>
</div>

<script>
let histChart = null;
let priceChart = null;

// Mengunci API Key yang Anda berikan
const TWELVE_DATA_API_KEY = "8cd5e84fa4564322b907aaddac29b059";

async function loadData() {
    const loadingEl = document.getElementById("loading");
    loadingEl.style.display = "block";
    loadingEl.innerHTML = "Memperbarui database kesehatan...";

    const intervalSelect = document.getElementById("interval").value;
    
    let interval = "1h";
    if (intervalSelect === "4h") {
        interval = "4h";
    } else if (intervalSelect === "1d") {
        interval = "1day";
    }

    try {
        // Mengambil 150 data lilin terakhir agar perhitungan EMA 100 akurat
        const url = `https://api.twelvedata.com/time_series?symbol=GBP/USD&interval=${interval}&outputsize=150&apikey=${TWELVE_DATA_API_KEY}`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.status !== "ok") {
            throw new Error(data.message || "Gagal memproses data.");
        }

        // Membalik urutan data agar kronologis (lama ke baru)
        const rawValues = [...data.values].reverse();

        let candles = rawValues.map(item => ({
            time: new Date(item.datetime),
            open: parseFloat(item.open),
            high: parseFloat(item.high),
            low: parseFloat(item.low),
            close: parseFloat(item.close)
        }));

        calculateStrategy(candles);
        loadingEl.style.display = "none";

    } catch (error) {
        console.error("Data Error:", error);
        loadingEl.innerHTML = "Gagal memuat database: " + error.message;
    }
}

// Rumus eksponensial untuk menghitung EMA
function calculateEMA(data, period) {
    let k = 2 / (period + 1);
    let emaArray = [];
    
    // Inisialisasi awal menggunakan SMA dari 'period' lilin pertama
    let sum = 0;
    for (let i = 0; i < period; i++) {
        sum += data[i].close;
    }
    let initialSMA = sum / period;
    
    for (let i = 0; i < data.length; i++) {
        if (i < period - 1) {
            emaArray.push(null); 
        } else if (i === period - 1) {
            emaArray.push(initialSMA);
        } else {
            let prevEma = emaArray[i - 1];
            let currentEma = (data[i].close * k) + (prevEma * (1 - k));
            emaArray.push(currentEma);
        }
    }
    return emaArray;
}

// Menghitung Nilai Posisi Close
function calcValue(index, data, lookback) {
    if (index - lookback + 1 < 0) {
        return 50.0;
    }

    let highestHigh = -Infinity;
    let lowestLow = Infinity;

    for (let i = index - lookback + 1; i <= index; i++) {
        if (data[i].high > highestHigh) {
            highestHigh = data[i].high;
        }
        if (data[i].low < lowestLow) {
            lowestLow = data[i].low;
        }
    }

    let range = highestHigh - lowestLow;
    if (range <= 0) {
        return 50.0;
    }

    let posClose = ((data[index].close - lowestLow) / range) * 100.0;
    posClose = Math.max(0.0, Math.min(100.0, posClose));

    return posClose;
}

function calculateStrategy(data) {
    const lookback = parseInt(document.getElementById("lookback").value) || 14;
    const smooth = parseInt(document.getElementById("smooth").value) || 3;
    const highLevel = parseFloat(document.getElementById("highLevel").value) || 85;
    const lowLevel = parseFloat(document.getElementById("lowLevel").value) || 15;

    // Perhitungan Histogram
    let histogram = [];
    for (let i = 0; i < data.length; i++) {
        let raw = calcValue(i, data, lookback);

        let sum = raw;
        let count = 1;

        for (let s = 1; s < smooth; s++) {
            if (i - s >= 0) {
                sum += calcValue(i - s, data, lookback);
                count++;
            }
        }
        histogram.push(sum / count);
    }

    // Perhitungan EMA 21, 50, dan 100
    const ema21 = calculateEMA(data, 21);
    const ema50 = calculateEMA(data, 50);
    const ema100 = calculateEMA(data, 100);

    const latestHist = histogram[histogram.length - 1];
    const latestPrice = data[data.length - 1].close;

    // Update UI Teks Detak & Indeks
    document.getElementById("histValue").innerHTML = latestHist.toFixed(2);
    document.getElementById("priceText").innerHTML = latestPrice.toFixed(5);

    // 1. Kondisi Sinyal Berdasarkan Level Histogram (B, S, N)
    let signal = "N";
    if (latestHist >= highLevel) {
        signal = "S"; // Sell disamarkan menjadi S (Merah)
    } else if (latestHist <= lowLevel) {
        signal = "B"; // Buy disamarkan menjadi B (Hijau)
    }

    const signalTextEl = document.getElementById("signalText");
    const signalBox = document.getElementById("signalBox");
    signalTextEl.innerHTML = signal;
    signalBox.innerHTML = signal;
    signalBox.className = "signal";

    if (signal === "B") {
        signalTextEl.style.color = "#22c55e"; // Hijau terang
        signalBox.classList.add("buy-style");
    } else if (signal === "S") {
        signalTextEl.style.color = "#ef4444"; // Merah terang
        signalBox.classList.add("sell-style");
    } else {
        signalTextEl.style.color = "#94a3b8"; // Abu-abu
        signalBox.classList.add("wait-style");
    }

    // 2. Status Tren Berdasarkan Hubungan Susunan EMA (B, S, N)
    const latestEMA21 = ema21[ema21.length - 1];
    const latestEMA50 = ema50[ema50.length - 1];
    const latestEMA100 = ema100[ema100.length - 1];

    let trend = "N";
    if (latestEMA21 > latestEMA50 && latestEMA50 > latestEMA100) {
        trend = "B"; // Bullish disamarkan B (Hijau)
    } else if (latestEMA21 < latestEMA50 && latestEMA50 < latestEMA100) {
        trend = "S"; // Bearish disamarkan S (Merah)
    }

    const trendTextEl = document.getElementById("trendText");
    trendTextEl.innerHTML = trend;
    if (trend === "B") {
        trendTextEl.style.color = "#22c55e";
    } else if (trend === "S") {
        trendTextEl.style.color = "#ef4444";
    } else {
        trendTextEl.style.color = "#94a3b8";
    }

    // Menggambar Grafik
    drawPriceChart(data, ema21, ema50, ema100);
    drawHistogramChart(data, histogram, highLevel, lowLevel);
}

function drawPriceChart(data, ema21, ema50, ema100) {
    const ctx = document.getElementById("priceChart").getContext("2d");

    if (priceChart) {
        priceChart.destroy();
    }

    const labels = data.map(x => x.time.toLocaleDateString([], { month: 'short', day: 'numeric' }) + " " + x.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    const prices = data.map(x => x.close);

    priceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'GU Close', // Diganti sesuai instruksi
                    data: prices,
                    borderColor: '#38bdf8',
                    backgroundColor: 'transparent',
                    tension: 0.1,
                    pointRadius: 0,
                    borderWidth: 2
                },
                {
                    label: 'EMA 21',
                    data: ema21,
                    borderColor: '#f59e0b', // Kuning/Oranye
                    backgroundColor: 'transparent',
                    tension: 0.1,
                    pointRadius: 0,
                    borderWidth: 1.5
                },
                {
                    label: 'EMA 50',
                    data: ema50,
                    borderColor: '#ec4899', // Pink Magenta
                    backgroundColor: 'transparent',
                    tension: 0.1,
                    pointRadius: 0,
                    borderWidth: 1.5
                },
                {
                    label: 'EMA 100',
                    data: ema100,
                    borderColor: '#10b981', // Hijau Kesehatan
                    backgroundColor: 'transparent',
                    tension: 0.1,
                    pointRadius: 0,
                    borderWidth: 1.5
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: 'white' }
                }
            },
            scales: {
                x: {
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8', maxTicksLimit: 12 }
                },
                y: {
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8' }
                }
            }
        }
    });
}

function drawHistogramChart(data, histogram, highLevel, lowLevel) {
    const ctx = document.getElementById("histChart").getContext("2d");

    if (histChart) {
        histChart.destroy();
    }

    const labels = data.map(x => x.time.toLocaleDateString([], { month: 'short', day: 'numeric' }) + " " + x.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    
    const colors = [];
    for (let i = 0; i < data.length; i++) {
        if (data[i].close >= data[i].open) {
            colors.push("#ff1493"); // DeepPink (Bullish)
        } else {
            colors.push("#1e90ff"); // DodgerBlue (Bearish)
        }
    }

    histChart = new Chart(ctx, {
        data: {
            labels: labels,
            datasets: [
                {
                    type: 'bar',
                    label: 'Indeks Detak',
                    data: histogram,
                    backgroundColor: colors,
                    barPercentage: 0.8,
                    categoryPercentage: 0.8
                },
                {
                    type: 'line',
                    label: `Batas Atas (${highLevel})`,
                    data: Array(histogram.length).fill(highLevel),
                    borderColor: '#eab308',
                    borderWidth: 1.5,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                },
                {
                    type: 'line',
                    label: `Batas Bawah (${lowLevel})`,
                    data: Array(histogram.length).fill(lowLevel),
                    borderColor: '#22d3ee',
                    borderWidth: 1.5,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: 'white' }
                }
            },
            scales: {
                x: {
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8', maxTicksLimit: 12 }
                },
                y: {
                    min: 0,
                    max: 100,
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8' }
                }
            }
        }
    });
}

// Memuat data awal
loadData();

// Interval refresh otomatis setiap 30 detik
setInterval(loadData, 30000);
</script>

</body>
</html>
